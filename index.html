<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有句话想对你说 ❤️</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
  color:white;
}
section{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.card{
  width:min(92vw,580px);
  padding:42px 30px;
  border:1px solid rgba(255,255,255,.4);
  border-radius:28px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 20px 70px rgba(100,30,60,.25);
  text-align:center;
}
.heart{font-size:72px}
h1{font-size:clamp(30px,6vw,46px);margin:10px 0 20px}
p{font-size:18px;line-height:1.9}
.strong{font-size:25px;font-weight:800}
.buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.btn{
  display:inline-block;
  text-decoration:none;
  padding:14px 28px;
  border-radius:999px;
  font-weight:800;
  font-size:17px;
}
.yes{background:white;color:#e65b7a}
.more{border:1px solid rgba(255,255,255,.6);color:white;background:rgba(255,255,255,.12)}
.quote{font-size:14px;opacity:.8;margin-top:22px}
#yes .card{
  background:rgba(255,255,255,.24);
}
.big{
  font-size:clamp(38px,8vw,64px);
  font-weight:900;
}
.small-heart{
  font-size:45px;
}
</style>
</head>
<body>

<section id="start">
  <div class="card">
    <div class="heart">❤️</div>
    <h1>写给吴研薇小朋友 ❤️</h1>
    <div style="text-align:left;max-width:460px;margin:0 auto;font-size:18px;line-height:2;">
      <p><strong>亲爱的吴研薇小朋友：</strong></p>
      <p>
        世界很大，幸福很小！<br>
        有你的陪伴，幸福刚刚好！
      </p>
      <p>
        时间不会停，幸福不会止！<br>
        乌云会有时，总会有风来！
      </p>
      <p style="text-align:right;margin-top:28px;font-weight:700;">
        —— 爱你的小黄
      </p>
    </div>

    <div class="buttons">
      <a class="btn yes" href="#yes">💗 我愿意</a>
      <a class="btn more" href="#more">再听我说一句</a>
    </div>

    <div class="quote">世界很大，但我想把偏爱留给你。</div>
  </div>
</section>

<section id="more">
  <div class="card">
    <div class="small-heart">💕</div>
    <h1>还有一句</h1>
    <p>
      我不是因为今天很浪漫才喜欢你，<br>
      而是因为喜欢你，今天才变得浪漫。
    </p>
    <div class="buttons">
      <a class="btn yes" href="#yes">好啦，我愿意 ❤️</a>
      <a class="btn more" href="#start">返回</a>
    </div>
  </div>
</section>

<section id="yes">
  <div class="card">
    <div class="heart">💖</div>
    <div class="big">那我们就在一起吧</div>
    <p style="margin-top:24px">
      从今天开始，<br>
      开心的事一起分享，难过的时候也不要一个人扛。<br>
      我会认真喜欢你，也认真对待我们的以后。
    </p>
    <p class="strong">请多多关照，我的女朋友 ❤️</p>

    <div class="buttons">
      <a class="btn yes" href="#start">再看一次</a>
    </div>
  </div>
</section>

</body>
</html>
