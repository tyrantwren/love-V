<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有句话想对你说 ❤️</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 2px,transparent 3px),
    radial-gradient(circle at 88% 30%,rgba(255,255,255,.22) 0 2px,transparent 3px),
    linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
  background-size:80px 80px,110px 110px,cover;
  color:white;
  overflow:hidden;
}
.app{
  width:100%;
  height:100dvh;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  position:relative;
  isolation:isolate;
}
.app::before,.app::after{
  content:"♥";
  position:absolute;
  z-index:-2;
  color:rgba(255,255,255,.15);
  font-size:clamp(90px,16vw,190px);
  pointer-events:none;
}
.app::before{left:2vw;top:5vh;transform:rotate(-18deg)}
.app::after{right:3vw;bottom:4vh;transform:rotate(18deg)}
.panel{
  display:none;
  width:min(92vw,580px);
  max-height:calc(100dvh - 36px);
  padding:22px 28px 26px;
  border:1px solid rgba(255,255,255,.48);
  border-radius:28px;
  background:rgba(255,255,255,.2);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 20px 70px rgba(100,30,60,.25);
  text-align:center;
  position:relative;
  overflow:hidden;
  animation:panelIn .36s ease;
}
.panel.active{display:block}
.panel::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 45%);
  pointer-events:none;
}
@keyframes panelIn{
  from{opacity:0;transform:translateY(10px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.dog-wrap{
  height:92px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:0;
  position:relative;
  z-index:1;
}
.dog{
  width:96px;
  height:96px;
  object-fit:contain;
  filter:drop-shadow(0 8px 14px rgba(109,48,68,.15));
  animation:floatDog 3.2s ease-in-out infinite;
}
@keyframes floatDog{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-6px) rotate(1deg)}
}
.heart{font-size:42px;line-height:1;position:relative;z-index:1}
h1{
  font-size:clamp(25px,5vw,38px);
  line-height:1.15;
  margin:6px 0 12px;
  position:relative;
  z-index:1;
}
p{
  font-size:16px;
  line-height:1.65;
  margin:9px 0;
  position:relative;
  z-index:1;
}
.letter{
  text-align:left;
  max-width:450px;
  margin:0 auto;
  position:relative;
  z-index:1;
}
.signature{text-align:right;margin-top:12px;font-weight:700}
.strong{font-size:21px;font-weight:800}
.big{
  font-size:clamp(30px,7vw,50px);
  line-height:1.1;
  font-weight:900;
  margin-top:4px;
  position:relative;
  z-index:1;
}
.small-heart{font-size:35px;position:relative;z-index:1}
.buttons{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:17px;
  position:relative;
  z-index:2;
}
.btn{
  appearance:none;
  border:none;
  cursor:pointer;
  padding:11px 22px;
  border-radius:999px;
  font-weight:800;
  font-size:15px;
  font-family:inherit;
  transition:transform .2s ease,box-shadow .2s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(100,30,60,.15)}
.yes{background:white;color:#e65b7a}
.more{border:1px solid rgba(255,255,255,.65);color:white;background:rgba(255,255,255,.12)}
.quote{font-size:13px;opacity:.82;margin-top:13px;position:relative;z-index:1}
.corner-dog{
  position:absolute;
  width:clamp(90px,15vw,170px);
  opacity:.11;
  z-index:-1;
  pointer-events:none;
  filter:grayscale(1) brightness(10);
}
.corner-left{left:2vw;bottom:3vh;transform:rotate(-10deg)}
.corner-right{right:2vw;top:4vh;transform:scaleX(-1) rotate(-8deg)}
.credit{
  position:fixed;
  right:9px;
  bottom:6px;
  z-index:20;
  font-size:9px;
  color:rgba(255,255,255,.5);
  text-decoration:none;
}
@media(max-height:720px){
  .app{padding:10px}
  .panel{max-height:calc(100dvh - 20px);padding:14px 22px 18px}
  .dog-wrap{height:66px}
  .dog{width:70px;height:70px}
  .heart{font-size:32px}
  h1{font-size:26px;margin:4px 0 8px}
  p{font-size:14px;line-height:1.5;margin:6px 0}
  .big{font-size:34px}
  .strong{font-size:18px}
  .buttons{margin-top:12px}
  .btn{padding:9px 18px;font-size:14px}
  .quote{margin-top:9px}
}
@media(max-width:640px){
  .app{padding:12px}
  .panel{width:94vw;padding:18px 18px 22px;border-radius:24px}
  .dog-wrap{height:78px}
  .dog{width:82px;height:82px}
  p{font-size:15px;line-height:1.55}
  .corner-dog{width:86px;opacity:.08}
}
@media(max-height:620px){
  .dog-wrap{display:none}
  .heart{font-size:28px}
  .panel{padding-top:12px;padding-bottom:14px}
  h1{font-size:23px}
  p{font-size:13px;line-height:1.42}
  .buttons{margin-top:9px}
}
@media(prefers-reduced-motion:reduce){
  .dog{animation:none}
  .panel{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <img class="corner-dog corner-left" src="https://openclipart.org/download/253861" alt="" aria-hidden="true">
  <img class="corner-dog corner-right" src="https://openclipart.org/download/311092" alt="" aria-hidden="true">

  <section class="panel active" id="start" aria-label="第一页">
    <div class="dog-wrap">
      <img class="dog" src="https://openclipart.org/download/311092" alt="可爱线条小狗">
    </div>
    <div class="heart">❤️</div>
    <h1>写给吴研薇小朋友 ❤️</h1>
    <div class="letter">
      <p><strong>亲爱的吴研薇小朋友：</strong></p>
      <p>世界很大，幸福很小！<br>有你的陪伴，幸福刚刚好！</p>
      <p>时间不会停，幸福不会止！<br>乌云会有时，总会有风来！</p>
      <p class="signature">—— 爱你的小黄</p>
    </div>
    <div class="buttons">
      <button class="btn yes" type="button" data-show="yes">💗 我愿意</button>
      <button class="btn more" type="button" data-show="more">再听我说一句</button>
    </div>
    <div class="quote">世界很大，但我想把偏爱留给你。</div>
  </section>

  <section class="panel" id="more" aria-label="第二页">
    <div class="dog-wrap">
      <img class="dog" src="https://openclipart.org/download/253861" alt="线条小狗插画">
    </div>
    <div class="small-heart">💕</div>
    <h1>还有一句</h1>
    <p>我不是因为今天很浪漫才喜欢你，<br>而是因为喜欢你，今天才变得浪漫。</p>
    <div class="buttons">
      <button class="btn yes" type="button" data-show="yes">好啦，我愿意 ❤️</button>
      <button class="btn more" type="button" data-show="start">返回</button>
    </div>
  </section>

  <section class="panel" id="yes" aria-label="第三页">
    <div class="dog-wrap">
      <img class="dog" src="https://openclipart.org/download/352457" alt="可爱小狗插画">
    </div>
    <div class="heart">💖</div>
    <div class="big">那我们就在一起吧</div>
    <p>从今天开始，<br>开心的事一起分享，难过的时候也不要一个人扛。<br>我会认真喜欢你，也认真对待我们的以后。</p>
    <p class="strong">请多多关照，我的女朋友 ❤️</p>
    <div class="buttons">
      <button class="btn yes" type="button" data-show="start">再看一次</button>
    </div>
  </section>
</div>

<a class="credit" href="https://openclipart.org" target="_blank" rel="noopener">dog art: Openclipart</a>

<script>
const panels = [...document.querySelectorAll('.panel')];
function showPanel(id){
  panels.forEach(panel => panel.classList.toggle('active', panel.id === id));
}
document.addEventListener('click', event => {
  const button = event.target.closest('[data-show]');
  if(button) showPanel(button.dataset.show);
});
</script>
</body>
</html>
