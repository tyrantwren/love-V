<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有句话想对你说 ❤️</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.28) 0 2px,transparent 3px),
    radial-gradient(circle at 88% 30%,rgba(255,255,255,.22) 0 2px,transparent 3px),
    linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
  background-size:80px 80px,110px 110px,cover;
  color:white;
  overflow-x:hidden;
}
section{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  isolation:isolate;
}
section::before,
section::after{
  content:"♥";
  position:absolute;
  z-index:-2;
  color:rgba(255,255,255,.16);
  font-size:clamp(80px,14vw,180px);
  pointer-events:none;
}
section::before{left:3vw;top:8vh;transform:rotate(-18deg)}
section::after{right:4vw;bottom:7vh;transform:rotate(18deg)}
.card{
  width:min(92vw,580px);
  padding:34px 30px 42px;
  border:1px solid rgba(255,255,255,.48);
  border-radius:28px;
  background:rgba(255,255,255,.19);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 20px 70px rgba(100,30,60,.25);
  text-align:center;
  position:relative;
  overflow:hidden;
}
.card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 45%);
  pointer-events:none;
}
.dog-wrap{
  height:130px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:4px;
  position:relative;
  z-index:1;
}
.dog{
  width:128px;
  height:128px;
  object-fit:contain;
  filter:drop-shadow(0 10px 16px rgba(109,48,68,.16));
  animation:floatDog 3.2s ease-in-out infinite;
}
#more .dog{width:118px;height:118px;animation-delay:.35s}
#yes .dog{width:132px;height:132px;animation-delay:.7s}
@keyframes floatDog{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-8px) rotate(1deg)}
}
.heart{font-size:64px;position:relative;z-index:1}
h1{font-size:clamp(30px,6vw,46px);margin:8px 0 20px;position:relative;z-index:1}
p{font-size:18px;line-height:1.9;position:relative;z-index:1}
.strong{font-size:25px;font-weight:800}
.buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px;position:relative;z-index:1}
.btn{
  display:inline-block;
  text-decoration:none;
  padding:14px 28px;
  border-radius:999px;
  font-weight:800;
  font-size:17px;
  transition:transform .2s ease,box-shadow .2s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(100,30,60,.15)}
.yes{background:white;color:#e65b7a}
.more{border:1px solid rgba(255,255,255,.6);color:white;background:rgba(255,255,255,.12)}
.quote{font-size:14px;opacity:.82;margin-top:22px;position:relative;z-index:1}
#yes .card{background:rgba(255,255,255,.24)}
.big{font-size:clamp(38px,8vw,64px);font-weight:900;position:relative;z-index:1}
.small-heart{font-size:45px;position:relative;z-index:1}
.corner-dog{
  position:absolute;
  width:clamp(90px,15vw,170px);
  opacity:.13;
  z-index:-1;
  pointer-events:none;
  filter:grayscale(1) brightness(10);
}
.corner-left{left:2vw;bottom:3vh;transform:rotate(-10deg)}
.corner-right{right:2vw;top:4vh;transform:scaleX(-1) rotate(-8deg)}
.credit{
  position:fixed;
  right:10px;
  bottom:8px;
  z-index:20;
  font-size:10px;
  color:rgba(255,255,255,.55);
  text-decoration:none;
}
@media(max-width:640px){
  .card{padding:28px 20px 34px}
  .dog-wrap{height:105px}
  .dog,#more .dog,#yes .dog{width:102px;height:102px}
  .heart{font-size:54px}
  p{font-size:16px}
  .corner-dog{width:90px;opacity:.10}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .dog{animation:none}
}
</style>
</head>
<body>

<section id="start">
  <img class="corner-dog corner-left" src="https://openclipart.org/download/253861" alt="" aria-hidden="true">
  <img class="corner-dog corner-right" src="https://openclipart.org/download/311092" alt="" aria-hidden="true">
  <div class="card">
    <div class="dog-wrap">
      <img class="dog" src="https://openclipart.org/download/311092" alt="可爱线条小狗">
    </div>
    <div class="heart">❤️</div>
    <h1>写给吴研薇小朋友 ❤️</h1>
    <div style="text-align:left;max-width:460px;margin:0 auto;font-size:18px;line-height:2;position:relative;z-index:1;">
      <p><strong>亲爱的吴研薇小朋友：</strong></p>
      <p>
        世界很大，幸福很小！<br>
        有你的陪伴，幸福刚刚好！
      </p>
      <p>
        时间不会停，幸福不会止！<br>
        乌云会有时，总会有风来！
      </p>
      <p style="text-align:right;margin-top:28px;font-weight:700;">
        —— 爱你的小黄
      </p>
    </div>

    <div class="buttons">
      <a class="btn yes" href="#yes">💗 我愿意</a>
      <a class="btn more" href="#more">再听我说一句</a>
    </div>

    <div class="quote">世界很大，但我想把偏爱留给你。</div>
  </div>
</section>

<section id="more">
  <img class="corner-dog corner-left" src="https://openclipart.org/download/352457" alt="" aria-hidden="true">
  <div class="card">
    <div class="dog-wrap">
      <img class="dog" src="https://openclipart.org/download/253861" alt="线条小狗插画">
    </div>
    <div class="small-heart">💕</div>
    <h1>还有一句</h1>
    <p>
      我不是因为今天很浪漫才喜欢你，<br>
      而是因为喜欢你，今天才变得浪漫。
    </p>
    <div class="buttons">
      <a class="btn yes" href="#yes">好啦，我愿意 ❤️</a>
      <a class="btn more" href="#start">返回</a>
    </div>
  </div>
</section>

<section id="yes">
  <img class="corner-dog corner-right" src="https://openclipart.org/download/253861" alt="" aria-hidden="true">
  <div class="card">
    <div class="dog-wrap">
      <img class="dog" src="https://openclipart.org/download/352457" alt="可爱小狗插画">
    </div>
    <div class="heart">💖</div>
    <div class="big">那我们就在一起吧</div>
    <p style="margin-top:24px">
      从今天开始，<br>
      开心的事一起分享，难过的时候也不要一个人扛。<br>
      我会认真喜欢你，也认真对待我们的以后。
    </p>
    <p class="strong">请多多关照，我的女朋友 ❤️</p>

    <div class="buttons">
      <a class="btn yes" href="#start">再看一次</a>
    </div>
  </div>
</section>

<a class="credit" href="https://openclipart.org" target="_blank" rel="noopener">dog art: Openclipart</a>

</body>
</html>
